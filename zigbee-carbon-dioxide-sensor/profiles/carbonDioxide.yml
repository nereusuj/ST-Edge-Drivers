name: carbonDioxide
components:
- id: main
  capabilities:
  - id: carbonDioxideMeasurement
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: AirQualityDetector
preferences:
  - name: "timeIntervalToReport"
    title: "Max Reporting Interval (Seconds)"
    description: "Maximum time in seconds to wait before reporting the value, even if it hasn't changed. (Default: 300)"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 3600
      default: 300
  - name: "minimumReportChanges"
    title: "Reportable Change Threshold"
    description: "Minimum change in value required to trigger a report when the Min Reporting Interval has passed. (Default: 20)"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 100
      default: 20
  - name: "minimumReportInterval"
    title: "Min Reporting Interval (Seconds)"
    description: "Minimum time in seconds that must pass between reports, even if the value changes significantly. (Default: 10)"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 3600
      default: 10
